{% extends "base.html" %}
{% block title %}Entrar · Food You{% endblock %}
{% block body %}
<div class="login">
  <div class="card">
    <p class="eyebrow">Food You · sincronización</p>
    <h1>Hola de nuevo</h1>
    <p class="muted" style="margin: 0 0 20px;">Solo para administradores.</p>
    {% if error %}<div class="notice bad" style="margin-bottom: 16px;" role="alert">{{ error }}</div>{% endif %}
    <form class="stack" method="post" action="/admin/login">
      <label>Usuario
        <input type="text" name="username" value="{{ username }}" autocomplete="username" autofocus required>
      </label>
      <label>Contraseña
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn" type="submit" style="justify-content: center;">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
